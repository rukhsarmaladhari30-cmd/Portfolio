# ==============================================================================
# SPRING BOOT CONFIGURATION - ONLINE LIBRARY MANAGEMENT SYSTEM
# ==============================================================================

server.port=8080
server.servlet.context-path=/api

# Spring Application Name
spring.application.name=online-library-system

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT Token Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Library Business Rules
app.library.loan-duration-days=14
app.library.fine-rate-per-day=5.00
app.library.max-books-per-student=5

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.library=DEBUG

